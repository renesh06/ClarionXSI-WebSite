      <path d="m79 66 6-8 4 4-2 10-6 3zM77 77l5-2 2 5-5 4zM109 85l6 3 5 10-4 2-7-9z"/>
      <!-- Africa -->
      <path d="m91 92 19-3 12 7 14 2 5 16 14 7-7 9-10 4-2 17-11 19-6 15-9 3-7-14-5-19-8-7-1-14-11-4-5-10 5-16z"/>
      <path d="m145 158 4-5 2 9-5 14-4-3z"/>
