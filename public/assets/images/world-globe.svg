<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <title>Blue world globe</title>
  <defs>
    <radialGradient id="ocean" cx=".3" cy=".22" r=".85">
      <stop stop-color="#a2eaff"/><stop offset=".4" stop-color="#3ba5ed"/><stop offset=".75" stop-color="#2857cc"/><stop offset="1" stop-color="#162d7a"/>
    </radialGradient>
    <linearGradient id="land" x1="60" y1="40" x2="185" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0ffff"/><stop offset=".5" stop-color="#b2eee9"/><stop offset="1" stop-color="#6acdcf"/>
    </linearGradient>
    <radialGradient id="shade" cx=".35" cy=".3" r=".75"><stop offset=".55" stop-color="#112565" stop-opacity="0"/><stop offset="1" stop-color="#112565" stop-opacity=".55"/></radialGradient>
    <clipPath id="sphere"><circle cx="120" cy="120" r="103"/></clipPath>
  </defs>
  <circle cx="120" cy="120" r="105" fill="#b6eaff"/>
